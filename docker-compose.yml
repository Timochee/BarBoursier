# Bar Boursier - Docker Compose Configuration
# Following Docker Best Practices: SLIM, DRI, BLoC, CLEAN, IMMUTABLE, CONFIG OUT, 1C1P

services:
  barboursier:
    build:
      context: .
      dockerfile: Dockerfile
    # TAG SMART: Use meaningful tag in production
    image: barboursier:${VERSION:-latest}
    container_name: barboursier-app
    restart: unless-stopped
    # CONFIG OUT: External configuration
    env_file: server/.env.production
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      # Persistent data storage
      - ./data:/app/data
    # IMMUTABLE: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # SECURE BY DEFAULT: Minimal capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # HEALTH: Defined in Dockerfile (uses curl for efficiency)
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # LOG TO STDOUT: Container logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Bar Boursier - Docker Compose Configuration
# Following Docker Best Practices: SLIM, DRI, BLoC, CLEAN, IMMUTABLE, CONFIG OUT, 1C1P

services:
  # Reverse proxy - 1C1P: Dedicated container for routing
  caddy:
    # TAG SMART: Pin specific version
    image: caddy:2.8-alpine
    container_name: barboursier-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      barboursier:
        condition: service_healthy
    # SECURE BY DEFAULT
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Application - 1C1P: Single responsibility
  barboursier:
    build:
      context: .
      dockerfile: Dockerfile
    # TAG SMART: Use meaningful tag in production
    image: barboursier:${VERSION:-latest}
    container_name: barboursier-app
    restart: unless-stopped
    # CONFIG OUT: External configuration
    env_file: server/.env.production
    environment:
      - NODE_ENV=production
    expose:
      - "3001"
    volumes:
      # Persistent data storage
      - ./data:/app/data
    # IMMUTABLE: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # SECURE BY DEFAULT: Minimal capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # HEALTH: Container health monitoring
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # LOG TO STDOUT: Container logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: barboursier_caddy_data
  caddy_config:
    name: barboursier_caddy_config
